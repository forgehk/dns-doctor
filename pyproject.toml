[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-doctor"
version = "0.1.0"
description = "One command to audit DNS, TLS, email-auth, and HTTP-security posture for a domain."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "@forgehk", email = "info@darkforgeai.com" }]
keywords = ["dns", "tls", "spf", "dkim", "dmarc", "security", "audit", "headers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "dnspython>=2.4",
    "cryptography>=42",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dns-doctor = "dns_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["dns_doctor*"]
